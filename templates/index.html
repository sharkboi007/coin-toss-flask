<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin Toss</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f5f5f5; text-align: center; padding: 4rem; }
      .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; }
      button { background: #0078d4; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 6px; cursor: pointer; }
      button:hover { background: #005a9e; }
      .result { margin-top: 1.5rem; font-size: 1.25rem; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Coin Toss</h1>
      <p>Press the button to toss a coin.</p>
      <form method="post">
        <button type="submit">Toss Coin</button>
      </form>
      {% if result %}
      <div class="result">Result: {{ result }}</div>
      {% endif %}
    </div>
  </body>
</html>
