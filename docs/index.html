<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin Toss Experience</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #eef2ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 28%),
                    linear-gradient(180deg, #061323 0%, #05070d 100%);
      }
      .hero {
        width: min(100%, 840px);
        text-align: center;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2.75rem, 5vw, 4.5rem);
        letter-spacing: -0.05em;
      }
      .hero p {
        margin: 1rem auto 0;
        max-width: 36rem;
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.8;
      }
      .card {
        width: min(100%, 860px);
        margin-top: 2rem;
        border-radius: 32px;
        padding: 2rem;
        background: rgba(8, 18, 39, 0.96);
        box-shadow: 0 35px 100px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(56, 189, 248, 0.14);
      }
      .coin-stage {
        display: grid;
        justify-items: center;
        gap: 1.5rem;
      }
      .coin {
        width: 220px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 20%, #f8e9ae 0%, #d7b055 40%, #7f5a1f 90%);
        border: 10px solid rgba(255, 238, 171, 0.22);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.14), 0 24px 55px rgba(0, 0, 0, 0.28);
        position: relative;
        display: grid;
        place-items: center;
        transform-style: preserve-3d;
        transition: transform 0.4s ease;
      }
      .coin.flipping {
        animation: flip 0.85s ease-out forwards;
      }
      @keyframes flip {
        0% { transform: perspective(700px) rotateX(10deg) rotateY(-25deg); }
        30% { transform: perspective(700px) rotateX(720deg) rotateY(340deg); }
        70% { transform: perspective(700px) rotateX(1080deg) rotateY(640deg); }
        100% { transform: perspective(700px) rotateX(1080deg) rotateY(640deg); }
      }
      .coin::before,
      .coin::after {
        content: "";
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 50%);
      }
      .coin::after {
        inset: 28px;
        background: radial-gradient(circle at 50% 52%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 70%);
      }
      .coin-face {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      .coin-face .top {
        position: absolute;
        top: 22px;
        width: 100%;
        text-align: center;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        color: #473017;
        font-weight: 700;
      }
      .coin-face .symbol {
        font-size: 5rem;
        color: #3a2611;
        font-weight: 900;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.45);
      }
      .coin-face .bottom {
        position: absolute;
        bottom: 22px;
        width: 100%;
        text-align: center;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        color: #473017;
        font-weight: 700;
      }
      .coin-face.heads .center {
        font-size: 2rem;
        font-weight: 800;
        color: #422c12;
      }
      .coin-face.tails .center {
        font-size: 1.4rem;
        font-weight: 800;
        color: #422c12;
      }
      .coin-face.tails .symbol {
        font-size: 4rem;
        color: #2b1f0f;
      }
      .coin-face.tails .top,
      .coin-face.tails .bottom {
        color: #2b1f0f;
      }
      .coin-face.tails .top {
        letter-spacing: 0.2em;
      }
      .coin-face.tails .bottom {
        letter-spacing: 0.18em;
      }
      .coin-face.tails {
        background: radial-gradient(circle at 40% 30%, rgba(255,255,255,0.12), transparent 40%);
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .buttons button {
        min-width: 140px;
        padding: 1rem 1.5rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, filter 0.2s ease;
      }
      .buttons button:hover {
        transform: translateY(-2px);
      }
      .buttons .toss {
        background: linear-gradient(135deg, #0ea5e9, #22d3ee);
        color: #020617;
      }
      .buttons .reset {
        background: linear-gradient(135deg, #fb7185, #f97316);
        color: #0f172a;
      }
      .stats {
        display: grid;
        gap: 0.85rem;
        margin-top: 1.75rem;
        padding: 1.5rem;
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      .stats div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        color: #cbd5e1;
      }
      .stats strong {
        color: #eef2ff;
        font-weight: 700;
      }
      .result-banner {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 1.1rem;
        padding: 1rem 1.2rem;
        border-radius: 18px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.16);
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Indian 1 Rupee Coin Toss</h1>
      <p>Flip an Indian 1 rupee coin right here on GitHub Pages. Track heads, tails, the current leader, and reset the game anytime.</p>
    </section>
    <article class="card">
      <div class="coin-stage">
        <div class="coin" id="coin">
          <div class="coin-face heads" id="coinFace">
            <div class="top" id="faceTop">BHARAT</div>
            <div class="symbol" id="faceSymbol">₹</div>
            <div class="center" id="faceCenter">Flip me</div>
            <div class="bottom" id="faceBottom">EK RUPIYA</div>
          </div>
        </div>
        <div class="buttons">
          <button class="toss" id="tossButton">Toss Coin</button>
          <button class="reset" id="resetButton">Reset</button>
        </div>
        <div class="stats">
          <div><span>Total tosses</span><strong id="tossCount">0</strong></div>
          <div><span>Heads</span><strong id="headsCount">0</strong></div>
          <div><span>Tails</span><strong id="tailsCount">0</strong></div>
          <div><span>Leader</span><strong id="leaderText">No tosses yet</strong></div>
        </div>
        <div class="result-banner" id="resultText">Start tossing to see the result.</div>
      </div>
    </article>
    <script>
      const tossButton = document.getElementById('tossButton');
      const resetButton = document.getElementById('resetButton');
      const coin = document.getElementById('coin');
      const coinFace = document.getElementById('coinFace');
      const tossCountEl = document.getElementById('tossCount');
      const headsCountEl = document.getElementById('headsCount');
      const tailsCountEl = document.getElementById('tailsCount');
      const leaderText = document.getElementById('leaderText');
      const resultText = document.getElementById('resultText');
      const faceCenter = document.getElementById('faceCenter');
      const faceSymbol = document.getElementById('faceSymbol');
      const faceTop = document.getElementById('faceTop');
      const faceBottom = document.getElementById('faceBottom');

      let tossCount = 0;
      let headsCount = 0;
      let tailsCount = 0;

      function updateLeader() {
        if (tossCount === 0) {
          leaderText.textContent = 'No tosses yet';
          return;
        }
        if (headsCount > tailsCount) {
          leaderText.textContent = 'Heads is winning';
        } else if (tailsCount > headsCount) {
          leaderText.textContent = 'Tails is winning';
        } else {
          leaderText.textContent = 'It\'s a tie';
        }
      }

      function refreshStats() {
        tossCountEl.textContent = tossCount;
        headsCountEl.textContent = headsCount;
        tailsCountEl.textContent = tailsCount;
        updateLeader();
      }

      function setCoinFace(side) {
        const isHeads = side === 'Heads';
        coinFace.classList.toggle('heads', isHeads);
        coinFace.classList.toggle('tails', !isHeads);
        faceCenter.textContent = isHeads ? 'Heads' : 'Tails';
        faceSymbol.textContent = isHeads ? '₹' : 'T';
        faceTop.textContent = isHeads ? 'BHARAT' : 'TAILS';
        faceBottom.textContent = isHeads ? 'EK RUPIYA' : 'FLIP SIDE';
      }

      tossButton.addEventListener('click', () => {
        tossButton.disabled = true;
        coin.classList.remove('flipping');
        void coin.offsetWidth;
        coin.classList.add('flipping');

        setTimeout(() => {
          const result = Math.random() < 0.5 ? 'Heads' : 'Tails';
          tossCount += 1;
          if (result === 'Heads') headsCount += 1;
          else tailsCount += 1;

          refreshStats();
          setCoinFace(result);
          resultText.textContent = `Result: ${result}`;
          tossButton.disabled = false;
        }, 850);
      });

      resetButton.addEventListener('click', () => {
        tossCount = 0;
        headsCount = 0;
        tailsCount = 0;
        refreshStats();
        setCoinFace('Heads');
        resultText.textContent = 'Start tossing to see the result.';
      });

      refreshStats();
    </script>
  </body>
</html>
