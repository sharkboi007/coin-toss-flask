<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin Toss Experience</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #eef2ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 28%),
                    linear-gradient(180deg, #061323 0%, #05070d 100%);
      }
      .hero {
        width: min(100%, 840px);
        text-align: center;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(2.75rem, 5vw, 4.5rem);
        letter-spacing: -0.05em;
      }
      .hero p {
        margin: 1rem auto 0;
        max-width: 36rem;
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.8;
      }
      .card {
        width: min(100%, 860px);
        margin-top: 2rem;
        border-radius: 32px;
        padding: 2rem;
        background: rgba(8, 18, 39, 0.96);
        box-shadow: 0 35px 100px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(56, 189, 248, 0.14);
      }
      .coin-stage {
        display: grid;
        justify-items: center;
        gap: 1.5rem;
        perspective: 1400px;
      }
      .coin {
        width: 240px;
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        position: relative;
        display: grid;
        place-items: center;
        transform-style: preserve-3d;
        transform-origin: center center;
        transform: perspective(1200px) rotateX(18deg) rotateY(-10deg);
        box-shadow: 0 30px 85px rgba(0, 0, 0, 0.28);
      }
      .coin img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }
      .coin.flipping {
        animation: flip 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes flip {
        0% {
          transform: perspective(1200px) translateY(0) rotateX(18deg) rotateY(-10deg);
          box-shadow: 0 30px 85px rgba(0, 0, 0, 0.28);
        }
        20% {
          transform: perspective(1200px) translateY(-22px) rotateX(520deg) rotateY(210deg);
          box-shadow: 0 44px 96px rgba(0, 0, 0, 0.24);
        }
        45% {
          transform: perspective(1200px) translateY(-16px) rotateX(880deg) rotateY(460deg);
          box-shadow: 0 38px 82px rgba(0, 0, 0, 0.22);
        }
        70% {
          transform: perspective(1200px) translateY(-10px) rotateX(1090deg) rotateY(550deg);
          box-shadow: 0 32px 68px rgba(0, 0, 0, 0.2);
        }
        100% {
          transform: perspective(1200px) translateY(0) rotateX(18deg) rotateY(-10deg);
          box-shadow: 0 30px 85px rgba(0, 0, 0, 0.28);
        }
      }
      .coin-face {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      .coin-face .top {
        position: absolute;
        top: 22px;
        width: 100%;
        text-align: center;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        color: #473017;
        font-weight: 700;
      }
      .coin-face .symbol {
        font-size: 5rem;
        color: #3a2611;
        font-weight: 900;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.45);
      }
      .coin-face .bottom {
        position: absolute;
        bottom: 22px;
        width: 100%;
        text-align: center;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
        color: #473017;
        font-weight: 700;
      }
      .coin-face.heads {
        background: radial-gradient(circle at 48% 52%, rgba(255, 255, 255, 0.08), transparent 58%);
      }
      .coin-face.heads .center {
        font-size: 2rem;
        font-weight: 800;
        color: #422c12;
      }
      .coin-face.tails {
        background: radial-gradient(circle at 45% 40%, rgba(255, 255, 255, 0.12), transparent 45%);
      }
      .coin-face.tails .center {
        font-size: 1.4rem;
        font-weight: 800;
        color: #422c12;
      }
      .coin-face.tails .symbol {
        font-size: 3.8rem;
        color: #2b1f0f;
      }
      .coin-face.tails .top,
      .coin-face.tails .bottom {
        color: #2b1f0f;
      }
      .coin-face.tails .top {
        letter-spacing: 0.2em;
      }
      .coin-face.tails .bottom {
        letter-spacing: 0.18em;
      }
      .buttons {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .buttons button {
        min-width: 140px;
        padding: 1rem 1.5rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, filter 0.2s ease;
      }
      .buttons button:hover {
        transform: translateY(-2px);
      }
      .buttons .toss {
        background: linear-gradient(135deg, #0ea5e9, #22d3ee);
        color: #020617;
      }
      .buttons .reset {
        background: linear-gradient(135deg, #fb7185, #f97316);
        color: #0f172a;
      }
      .stats {
        display: grid;
        gap: 0.85rem;
        margin-top: 1.75rem;
        padding: 1.5rem;
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      .stats div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        color: #cbd5e1;
      }
      .stats strong {
        color: #eef2ff;
        font-weight: 700;
      }
      .result-banner {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 1.1rem;
        padding: 1rem 1.2rem;
        border-radius: 18px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.16);
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>Indian 1 Rupee Coin Toss</h1>
      <p>Flip an Indian 1 rupee coin right here on GitHub Pages. Track heads, tails, the current leader, and reset the game anytime.</p>
    </section>
    <article class="card">
      <div class="coin-stage">
        <div class="coin" id="coin">
          <img id="coinImage" src="images/coin-default.png" alt="1 rupee coin" />
        </div>
        <div class="buttons">
          <button class="toss" id="tossButton">Toss Coin</button>
          <button class="reset" id="resetButton">Reset</button>
        </div>
        <div class="stats">
          <div><span>Total tosses</span><strong id="tossCount">0</strong></div>
          <div><span>Heads</span><strong id="headsCount">0</strong></div>
          <div><span>Tails</span><strong id="tailsCount">0</strong></div>
          <div><span>Leader</span><strong id="leaderText">No tosses yet</strong></div>
        </div>
        <div class="result-banner" id="resultText">Start tossing to see the result.</div>
      </div>
    </article>
    <script>
      const tossButton = document.getElementById('tossButton');
      const resetButton = document.getElementById('resetButton');
      const coin = document.getElementById('coin');
      const coinImage = document.getElementById('coinImage');
      const tossCountEl = document.getElementById('tossCount');
      const headsCountEl = document.getElementById('headsCount');
      const tailsCountEl = document.getElementById('tailsCount');
      const leaderText = document.getElementById('leaderText');
      const resultText = document.getElementById('resultText');

      let tossCount = 0;
      let headsCount = 0;
      let tailsCount = 0;

      function updateLeader() {
        if (tossCount === 0) {
          leaderText.textContent = 'No tosses yet';
          return;
        }
        if (headsCount > tailsCount) {
          leaderText.textContent = 'Heads is winning';
        } else if (tailsCount > headsCount) {
          leaderText.textContent = 'Tails is winning';
        } else {
          leaderText.textContent = 'It\'s a tie';
        }
      }

      function refreshStats() {
        tossCountEl.textContent = tossCount;
        headsCountEl.textContent = headsCount;
        tailsCountEl.textContent = tailsCount;
        updateLeader();
      }

      function setCoinFace(side) {
        if (side === 'Heads') {
          coinImage.src = 'images/coin-heads.png';
          coinImage.alt = 'Heads side of 1 rupee coin';
        } else if (side === 'Tails') {
          coinImage.src = 'images/coin-tails.png';
          coinImage.alt = 'Tails side of 1 rupee coin';
        } else {
          coinImage.src = 'images/coin-default.png';
          coinImage.alt = '1 rupee coin';
        }
      }

      tossButton.addEventListener('click', () => {
        tossButton.disabled = true;
        coin.classList.remove('flipping');
        void coin.offsetWidth;
        coin.classList.add('flipping');

        setTimeout(() => {
          const result = Math.random() < 0.5 ? 'Heads' : 'Tails';
          tossCount += 1;
          if (result === 'Heads') headsCount += 1;
          else tailsCount += 1;

          refreshStats();
          setCoinFace(result);
          resultText.textContent = `Result: ${result}`;
          tossButton.disabled = false;
        }, 850);
      });

      resetButton.addEventListener('click', () => {
        tossCount = 0;
        headsCount = 0;
        tailsCount = 0;
        refreshStats();
        setCoinFace('Heads');
        resultText.textContent = 'Start tossing to see the result.';
      });

      refreshStats();
    </script>
  </body>
</html>
